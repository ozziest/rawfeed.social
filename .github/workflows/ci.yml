name: CI
permissions:
  contents: read
on:
  push:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:ci

      - name: Integration tests
        run: npm run test:sqlite

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
